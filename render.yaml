services:
  - type: web
    name: ksomu-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: ksomu-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
